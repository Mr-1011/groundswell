<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groundswell</title>
    <meta name="description" content="Community resistance to data centers per US county." />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* dark before the stylesheet arrives: no white flash on slow connections */
      html,
      body {
        background: #0b0b0b;
      }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Groundswell" />
    <meta property="og:description" content="Community resistance to data centers per US county." />
    <meta name="twitter:card" content="summary" />
    <!-- black square, one orange dot (the resistance color) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e4672b'/%3E%3C/svg%3E"
    />
    <!-- biggest data file: start it together with the script, not after it -->
    <link rel="preload" href="/counties.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- same outline as Skeleton in src/App.tsx; shows before the script arrives, React replaces it -->
      <div class="app" aria-busy="true">
        <main class="map-area skel-map"><span class="mono muted">loading county data…</span></main>
        <aside class="side">
          <div class="tabs"><button class="on">info</button></div>
          <div class="side-body">
            <div class="skel skel-stats"></div>
            <div class="skel skel-line" style="width: 40%"></div>
            <div class="skel skel-line" style="width: 100%"></div>
            <div class="skel skel-line" style="width: 30%"></div>
            <div class="skel skel-line" style="width: 90%"></div>
            <div class="skel skel-line" style="width: 80%"></div>
            <div class="skel skel-line" style="width: 85%"></div>
            <div class="skel skel-line" style="width: 70%"></div>
            <div class="skel skel-line" style="width: 60%"></div>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
