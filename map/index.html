<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groundswell</title>
    <meta name="description" content="Community resistance to data centers per US county." />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* dark before the stylesheet arrives: no white flash on slow connections */
      html,
      body {
        background: #0b0b0b;
      }
    </style>
    <link rel="canonical" href="https://groundswell-dun.vercel.app/" />
    <!-- link previews; scrapers need absolute URLs. og.png is a static file in map/data/ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Groundswell" />
    <meta property="og:url" content="https://groundswell-dun.vercel.app/" />
    <meta property="og:title" content="Groundswell" />
    <meta property="og:description" content="Community resistance to data centers per US county." />
    <meta property="og:image" content="https://groundswell-dun.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Groundswell" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Groundswell" />
    <meta name="twitter:description" content="Community resistance to data centers per US county." />
    <meta name="twitter:image" content="https://groundswell-dun.vercel.app/og.png" />
    <!-- black square, one orange square (the resistance color, a county cell) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0b'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23e4672b'/%3E%3C/svg%3E"
    />
    <!-- biggest data file: start it together with the script, not after it -->
    <link rel="preload" href="/counties.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- same outline as Skeleton in src/App.tsx; shows before the script arrives, React replaces it -->
      <div class="app" aria-busy="true">
        <main class="map-area skel-map"><div class="boot"><div class="swell"></div><span class="mono">groundswell</span></div></main>
        <aside class="side">
          <div class="tabs"><button class="on">info</button></div>
          <div class="side-body">
            <div class="skel skel-stats"></div>
            <div class="skel skel-line" style="width: 40%"></div>
            <div class="skel skel-line" style="width: 100%"></div>
            <div class="skel skel-line" style="width: 30%"></div>
            <div class="skel skel-line" style="width: 90%"></div>
            <div class="skel skel-line" style="width: 80%"></div>
            <div class="skel skel-line" style="width: 85%"></div>
            <div class="skel skel-line" style="width: 70%"></div>
            <div class="skel skel-line" style="width: 60%"></div>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
